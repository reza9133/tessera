name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 -m unittest discover -s tests -t . -v
      - run: node --test tests/js/rules.test.mjs
      - name: Golden vectors are current
        run: python3 tools/make_vectors.py && git diff --exit-code tests/vectors/rules.json
      - name: Mutation testing (every rule must be guarded by a test)
        run: python3 tools/mutate.py
